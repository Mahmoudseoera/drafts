<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Thank you — Your inquiry preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#edf3f3;color:#0d2830;font:14px/1.7 Poppins,system-ui,sans-serif}main{background:white;border:1px solid #dae4e7;border-radius:26px;max-width:680px;width:100%;padding:42px;box-shadow:0 14px 50px #123e4910}.mark{display:grid;place-items:center;border-radius:50%;width:60px;height:60px;background:#ddeef1;color:#0e6b7b;font-size:28px}h1{font-size:28px;line-height:1.3;margin:20px 0 12px}p{color:#587078}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.8 Poppins,system-ui,sans-serif;background:#f1f6f7;padding:20px;border-radius:16px;margin:24px 0}nav{display:flex;gap:12px;flex-wrap:wrap}a,button{font:500 13px Poppins,system-ui,sans-serif;text-decoration:none;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:#0e6b7b;color:white}a{background:#ddeef1;color:#0e6b7b}:focus-visible{outline:3px solid #d58d29;outline-offset:4px}#status{font-size:12px}@media(max-width:500px){body{padding:14px}main{padding:25px}h1{font-size:23px}nav>*{width:100%;text-align:center}}
</style></head><body><main><div class="mark" aria-hidden="true">✓</div><h1>Thank you for planning with us</h1><p>Your inquiry preview is ready. <strong>Nothing has been sent and no booking is confirmed.</strong> You can copy your trip summary below.</p><pre id="summary">No saved inquiry preview was found. Return to the tour to plan your trip.</pre><nav><button id="copy" type="button">Copy trip summary</button><a href="classic-egypt-tour.html#book">Return to booking</a><a href="classic-egypt-tour.html">Tour overview</a></nav><p id="status" role="status"></p></main><script>
let saved='';try{saved=sessionStorage.getItem('tour-inquiry-preview')||'';}catch{}if(saved)document.getElementById('summary').textContent=saved;document.getElementById('copy').disabled=!saved;document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(saved);document.getElementById('status').textContent='Trip summary copied.';}catch{const range=document.createRange();range.selectNodeContents(document.getElementById('summary'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);document.getElementById('status').textContent='Summary selected. Use your browser’s Copy command.';}});
</script></body></html>
